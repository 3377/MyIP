<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美团API测试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        line-height: 1.6;
      }
      .result {
        margin: 20px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .error {
        color: red;
      }
      button {
        margin: 5px;
        padding: 5px 10px;
      }
      input {
        padding: 5px;
        width: 200px;
      }
    </style>
  </head>
  <body>
    <h1>美团API测试</h1>

    <div>
      <h2>1. IP定位API测试</h2>
      <input
        type="text"
        id="ipInput"
        placeholder="输入IP地址"
        value="183.156.67.253"
      />
      <button onclick="testIpApi()">测试IP定位API</button>
      <div id="ipResult" class="result">结果将显示在这里</div>
    </div>

    <div>
      <h2>2. 经纬度街道API测试</h2>
      <input
        type="text"
        id="latInput"
        placeholder="输入纬度"
        value="30.312715"
      />
      <input
        type="text"
        id="lngInput"
        placeholder="输入经度"
        value="120.080288"
      />
      <button onclick="testLocationApi(0)">测试街道API (tag=0)</button>
      <button onclick="testLocationApi(1)">测试街道API (tag=1)</button>
      <div id="locationResult" class="result">结果将显示在这里</div>
    </div>

    <script>
      function testIpApi() {
        const ip = document.getElementById("ipInput").value.trim();
        if (!ip) {
          alert("请输入IP地址");
          return;
        }

        const resultDiv = document.getElementById("ipResult");
        resultDiv.innerHTML = "正在请求...";

        // 尝试不同的方式调用API
        const methods = [
          // 方式1: 使用jsonp-lite代理
          function () {
            const proxyUrl = "https://jsonp.afeld.me/?url=";
            const targetUrl = encodeURIComponent(
              `https://apimobile.meituan.com/locate/v2/ip/loc?ip=${ip}`
            );

            fetch(proxyUrl + targetUrl)
              .then((response) => response.json())
              .then((data) => {
                console.log("方式1返回:", data);
                resultDiv.innerHTML =
                  "<pre>方式1返回:\n" +
                  JSON.stringify(data, null, 2) +
                  "</pre>";
              })
              .catch((error) => {
                console.log("方式1失败:", error);
                tryNextMethod();
              });
          },

          // 方式2: 使用allorigins代理（已验证成功的方式）
          function () {
            const proxyUrl = "https://api.allorigins.win/get?url=";
            const targetUrl = encodeURIComponent(
              `https://apimobile.meituan.com/locate/v2/ip/loc?ip=${ip}`
            );

            fetch(proxyUrl + targetUrl)
              .then((response) => response.json())
              .then((data) => {
                console.log("方式2返回:", data);
                try {
                  const jsonData = JSON.parse(data.contents);
                  resultDiv.innerHTML =
                    "<pre>方式2返回:\n" +
                    JSON.stringify(jsonData, null, 2) +
                    "</pre>";
                } catch (e) {
                  console.log("解析失败:", e);
                  tryNextMethod();
                }
              })
              .catch((error) => {
                console.log("方式2失败:", error);
                tryNextMethod();
              });
          },

          // 方式3: 使用另一个代理服务
          function () {
            const proxyUrl = "https://proxy.cors.sh/";
            const targetUrl = `https://apimobile.meituan.com/locate/v2/ip/loc?ip=${ip}`;

            fetch(proxyUrl + targetUrl, {
              headers: {
                "x-cors-api-key":
                  "temp_" + Math.random().toString(36).substring(7),
                Origin: "null",
                "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 14_7_1 like Mac OS X) AppleWebKit/605.1.15",
              },
            })
              .then((response) => response.json())
              .then((data) => {
                console.log("方式3返回:", data);
                resultDiv.innerHTML =
                  "<pre>方式3返回:\n" +
                  JSON.stringify(data, null, 2) +
                  "</pre>";
              })
              .catch((error) => {
                console.log("方式3失败:", error);
                tryNextMethod();
              });
          },

          // 方式4: 使用cloudflare worker代理
          function () {
            const proxyUrl = "https://corsproxy.io/?";
            const targetUrl = encodeURIComponent(
              `https://apimobile.meituan.com/locate/v2/ip/loc?ip=${ip}`
            );

            fetch(proxyUrl + targetUrl)
              .then((response) => response.json())
              .then((data) => {
                console.log("方式4返回:", data);
                resultDiv.innerHTML =
                  "<pre>方式4返回:\n" +
                  JSON.stringify(data, null, 2) +
                  "</pre>";
              })
              .catch((error) => {
                console.log("方式4失败:", error);
                tryNextMethod();
              });
          },
        ];

        let currentMethod = 0;

        function tryNextMethod() {
          if (currentMethod < methods.length) {
            console.log(`尝试方式 ${currentMethod + 1}`);
            methods[currentMethod]();
            currentMethod++;
          } else {
            resultDiv.innerHTML = '<div class="error">所有方式都失败了</div>';
            // 显示备用信息
            console.log("尝试使用备用方案获取位置信息");
            resultDiv.innerHTML +=
              "<div>备注：方式2（allorigins代理）是可用的，如果失败请重试</div>";
          }
        }

        // 开始尝试第一个方式
        tryNextMethod();
      }

      function testLocationApi(tag) {
        const lat = document.getElementById("latInput").value.trim();
        const lng = document.getElementById("lngInput").value.trim();

        if (!lat || !lng) {
          alert("请输入经纬度");
          return;
        }

        const resultDiv = document.getElementById("locationResult");
        resultDiv.innerHTML = "正在请求...";

        // 创建script标签进行JSONP请求
        const script = document.createElement("script");
        const callbackName = "locationCallback_" + Date.now();

        // 定义回调函数
        window[callbackName] = function (response) {
          console.log("街道API返回:", response);
          resultDiv.innerHTML =
            "<pre>" + JSON.stringify(response, null, 2) + "</pre>";
          // 清理
          document.body.removeChild(script);
          delete window[callbackName];
        };

        // 处理错误
        script.onerror = function () {
          resultDiv.innerHTML = '<div class="error">请求失败</div>';
          document.body.removeChild(script);
          delete window[callbackName];
        };

        script.src = `https://apimobile.meituan.com/group/v1/city/latlng/${lat},${lng}?tag=${tag}&callback=${callbackName}`;
        document.body.appendChild(script);
      }

      // 页面加载完成后自动测试IP定位API
      document.addEventListener("DOMContentLoaded", function () {
        testIpApi();
      });
    </script>
  </body>
</html>
